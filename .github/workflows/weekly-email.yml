name: Weekly email digest

# PAUSED — the scheduled trigger below is commented out, so this workflow
# no longer runs automatically and sends no email. It can still be run
# manually from the Actions tab (workflow_dispatch) if needed for testing
# (email.enabled in config/settings.yaml must also be true for it to
# actually send anything even then). See README.md's "Pausing and
# resuming" section for how to turn the schedule back on.
on:
  # schedule:
  #   - cron: "0 8 * * 5"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/run_weekly_email.py
